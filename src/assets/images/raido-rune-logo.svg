<svg width="680" height="250" viewBox="0 0 680 250" xmlns="http://www.w3.org/2000/svg" role="img">
<title>RAIDO rune wordmark</title>
<desc>Five rune-inspired glyphs forming the word RAIDO, redrawn with straighter strokes to resemble Latin letters R, A, I, D, O</desc>

<g stroke="#1a1a1a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">

<!-- R (Raido) -->
<g transform="translate(130,70)">
<path d="M0,0 L0,140" />
<path d="M0,0 L40,25 L0,60" />
<path d="M0,60 L45,140" />
</g>

<!-- A (Ansuz, straightened) -->
<g transform="translate(220,70)">
<path d="M0,140 L25,0 L50,140" />
<path d="M10,88 L40,88" />
</g>

<!-- I (Isaz) -->
<g transform="translate(310,70)">
<path d="M20,0 L20,140" />
</g>

<!-- D (Dagaz, straightened) -->
<g transform="translate(400,70)">
<path d="M0,0 L0,140" />
<path d="M0,0 L45,40 L45,100 L0,140" />
</g>

<!-- O (Othala, straightened) -->
<g transform="translate(490,70)">
<path d="M15,0 L45,0 L60,25 L60,115 L45,140 L15,140 L0,115 L0,25 Z" />
</g>

</g>
</svg>
